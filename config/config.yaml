# ================================================================
# Appium 自动化测试配置文件
# ----------------------------------------------------------------
# 作用：集中管理 Appium Server 连接信息与设备/App 的 desired capabilities。
# 框架运行时通过 utils/yaml_util.py 读取本文件，
# 修改设备或切换被测 App 时无需改动代码，只改配置即可。
# ================================================================

# Appium Server 相关配置
appium:
  # Appium Server 的访问地址（本机默认为 127.0.0.1，远程/云真机改成对应 IP）
  host: 127.0.0.1
  # Appium Server 端口（默认 4723）
  port: 4723
  # Appium 2.x 的 W3C 路径为 /，1.x 为 /wd/hub。Appium 2.x 请保持 /
  path: /
  # 连接 Server 的完整 URL 由代码根据以上三项自动拼接，也可在此直接指定
  # remote_url: http://127.0.0.1:4723/

# 被测设备与 App 的能力配置（Desired Capabilities）
# 说明：以下为 Android 常见配置，iOS 或不同 App 请按实际修改对应值
capabilities:
  # 自动化引擎：Appium 2.x 使用 UiAutomator2
  automationName: UiAutomator2
  # 平台名称：Android 或 iOS
  platformName: Android
  # 设备名称：通过 adb devices 查看到的设备序列号/名称
  deviceName: emulator-5554
  # 平台版本：设备系统版本号
  platformVersion: "15"
  # 被测 App 的包名（通过 adb 或 aapt 工具获取：adb -s 127.0.0.1:7555 shell dumpsys window | findstr CurrentFocus）
  appPackage: com.hd.smartVillage
  # 被测 App 的启动 Activity 名
  appActivity: .modules.main.MainActivity
  # 是否重置 App 状态：false 表示保留上次会话数据
  noReset: true
  # 是否自动授权 App 请求的权限（Android）
  autoGrantPermissions: true
  # 使用 Unicode 输入法，支持中文输入
  unicodeKeyboard: true
  resetKeyboard: true
  # 新命令超时时间（秒），超时后 Server 认为会话结束
  newCommandTimeout: 300
  # 如需自动安装本地 apk，可放开下面一行并填写 apk 文件的完整路径（注意与 appPackage/appActivity 保持一致）
  # 注意：本行缩进必须与上方 capabilities 子项一致（2 个空格）；Windows 路径含反斜杠，
  # 必须用单引号包裹（双引号内反斜杠会被当作转义符导致解析报错）
  app: 'D:\project\自动化框架\APP\com.hd.smartVillage_3.8.1.apk'
