# ================================================================
# 登录功能测试数据（账号密码登录）
# ----------------------------------------------------------------
# 作用：把测试数据从测试脚本中剥离出来，实现「数据驱动」。
# scripts 层通过 utils.yaml_util 读取本文件，用 pytest 参数化批量执行用例。
# 新增测试场景时，只需在此追加一条数据，无需修改测试代码。
# 字段说明：
#   case_name  用例名称（会显示在 allure 报告中）
#   account    输入的账号（手机号）
#   password   输入的密码
#   expected   预期结果：离开登录页（登录成功进入首页）/ 停留登录页（登录被拦截）
# ================================================================

# 有效账号（正向登录用例使用）
valid_account:
  account: "13392231931"
  password: "licuier1013"

login_data:
  - case_name: "正确账号密码_登录成功"
    account: "13392231931"
    password: "licuier1013"
    expected: "离开登录页"

  - case_name: "密码错误_停留登录页"
    account: "13392231931"
    password: "wrong_password_123"
    expected: "停留登录页"
