# ================================================================
# pytest 全局配置文件
# ----------------------------------------------------------------
# 作用：定义 pytest 的运行规则，包括用例查找路径、命名规则、
# 默认命令行参数、日志格式、自定义标记等。
# 执行 `pytest` 时会自动读取本文件，无需在命令行重复输入这些参数。
# ================================================================
[pytest]
# 将项目根目录加入 Python 导入路径，保证 config/utils/base/pages 等包能被正常 import
pythonpath = .

# 用例搜索目录：只在 scripts 目录下查找测试用例
testpaths = scripts

# 用例文件命名规则：匹配 test_ 开头的 .py 文件
python_files = test_*.py
# 用例类命名规则：匹配 Test 开头的类
python_classes = Test*
# 用例方法命名规则：匹配 test_ 开头的函数
python_functions = test_*

# 默认附加的命令行参数：
#   -s              允许输出 print / 日志到控制台
#   -v              显示每条用例的详细执行结果
#   --alluredir     指定 allure 原始结果（json）的输出目录
#   --clean-alluredir 每次运行前清空上一次的 allure 结果，避免报告叠加
addopts = -s -v --alluredir=./report/allure-result --clean-alluredir

# 关闭 pytest 对非 ASCII（中文）用例 id 的 \uXXXX 转义。
# 数据驱动用例的中文 id 若被转义会变成超长乱码串，导致 allure 报告用例名重叠、不可读；
# 开启后中文用例名原样显示。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# ---------------------- 实时日志输出配置 ----------------------
# 开启命令行实时日志
log_cli = true
# 实时日志级别
log_cli_level = INFO
# 实时日志格式
log_cli_format = %(asctime)s - %(filename)s[line:%(lineno)d] - %(levelname)s: %(message)s
# 实时日志时间格式
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ---------------------- 自定义标记（markers） ----------------------
# 注册标记，避免 pytest 出现 PytestUnknownMarkWarning 警告
# 使用时通过 -m smoke 只跑冒烟用例
markers =
    smoke: 冒烟测试用例（核心主流程）
    regression: 回归测试用例
    login: 登录模块用例
